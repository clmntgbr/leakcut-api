services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/livez"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
    ports:
      - "4000:3000"
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    env_file:
      - .env
    environment:
      CENTRIFUGO_URL: http://centrifugo:8000/api
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev-centrifugo-api-key}
      CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET:-dev-centrifugo-token-secret}
      CENTRIFUGO_PUBLIC_WS_URL: ${CENTRIFUGO_PUBLIC_WS_URL:-ws://localhost:8000/connection/websocket}
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      centrifugo:
        condition: service_started
    networks:
      - api
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: worker
    command: ["go", "run", "./cmd/worker"]
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    env_file:
      - .env
    environment:
      CENTRIFUGO_URL: http://centrifugo:8000/api
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev-centrifugo-api-key}
      CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET:-dev-centrifugo-token-secret}
      CENTRIFUGO_PUBLIC_WS_URL: ${CENTRIFUGO_PUBLIC_WS_URL:-ws://localhost:8000/connection/websocket}
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      centrifugo:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - api
    restart: unless-stopped

  frame:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: frame
    command: ["go", "run", "./cmd/frame"]
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - api
    restart: unless-stopped

  paddleocr:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    container_name: paddleocr
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 180s
    environment:
      OCR_LANG: ${OCR_LANG:-fr+en}
      PADDLEOCR_VERSION: ${PADDLEOCR_VERSION:-PP-OCRv5}
    networks:
      - api
    restart: unless-stopped

  ocr:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: ocr
    command: ["go", "run", "./cmd/ocr"]
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    env_file:
      - .env
    environment:
      PADDLEOCR_URL: http://paddleocr:8080
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      paddleocr:
        condition: service_healthy
    networks:
      - api
    restart: unless-stopped

  database:
    container_name: datastore
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "9543:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    networks:
      - api
    restart: unless-stopped

  rabbitmq:
    container_name: broker
    image: rabbitmq:3.13-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "9002:5672"
      - "9003:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-password}
    networks:
      - api
    restart: unless-stopped

  minio:
    container_name: s3
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: devuser
      MINIO_ROOT_PASSWORD: devpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - api
    restart: unless-stopped

  mc:
    container_name: mc
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 devuser devpassword; do sleep 1; done;
      mc mb myminio/${STORAGE_BUCKET:-media} --ignore-existing;
      mc mb myminio/${STORAGE_THUMBNAIL_BUCKET:-thumbnails} --ignore-existing;
      mc admin config set myminio notify_webhook:analyze endpoint='http://api:3000/webhooks/minio/object-created' auth_token='${MINIO_WEBHOOK_SECRET}';
      mc admin service restart myminio --json;
      sleep 5;
      mc event remove myminio/${STORAGE_BUCKET:-media} --force || true;
      mc event add myminio/${STORAGE_BUCKET:-media} arn:minio:sqs::analyze:webhook --event put --prefix videos/ --suffix original.mp4 -p;
      "
    networks:
      - api

  centrifugo:
    container_name: centrifugo
    image: centrifugo/centrifugo:v5
    command: ["centrifugo", "-c", "config.json"]
    ports:
      - "8000:8000"
    volumes:
      - ./centrifugo:/centrifugo:ro
    working_dir: /centrifugo
    environment:
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev-centrifugo-api-key}
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET:-dev-centrifugo-token-secret}
      CENTRIFUGO_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:-http://localhost:3000 http://localhost:3001}
    networks:
      - api
    restart: unless-stopped

  ngrok:
    container_name: ngrok
    image: ngrok/ngrok:latest
    command: http --url=choice-pretty-leech.ngrok-free.app --host-header=choice-pretty-leech.ngrok-free.app http://api:3000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    networks:
      - api
    restart: unless-stopped

  mailpit:
    container_name: mailpit
    image: axllent/mailpit:latest
    ports:
      - "9025:1025"
      - "9026:8025"
    networks:
      - api
    restart: unless-stopped

volumes:
  go-modules:
  go-build-cache:
  minio_data:
  database_data:

networks:
  api:
    name: go
