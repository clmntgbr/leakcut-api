services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: api
    command: ["./api"]
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: worker
    command: ["./worker"]
    env_file:
      - .env
    restart: unless-stopped

  frame:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: ["./frame"]
    env_file:
      - .env
    restart: unless-stopped

  ocr:
    build:
      context: ./cmd/ocr
      dockerfile: Dockerfile
    shm_size: "1gb"
    env_file:
      - .env
    environment:
      OCR_LANG: ${OCR_LANG:-fr+en}
      OCR_QUEUE: ${OCR_QUEUE:-ocr}
      OCR_ROUTING_KEY: ${OCR_ROUTING_KEY:-video.ocr_frame_requested.v1}
      OCR_INFER_CONCURRENCY: ${OCR_INFER_CONCURRENCY:-2}
      OCR_INTRA_OP_THREADS: ${OCR_INTRA_OP_THREADS:-2}
      OCR_BATCH_SIZE: ${OCR_BATCH_SIZE:-8}
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-1}
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ocr-ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  classify:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: ["./classify"]
    env_file:
      - .env
    restart: unless-stopped
