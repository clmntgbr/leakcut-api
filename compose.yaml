services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: api
    command: ["./api"]
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: worker
    command: ["./worker"]
    env_file:
      - .env
    restart: unless-stopped

  frame:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: frame
    command: ["./frame"]
    env_file:
      - .env
    restart: unless-stopped

  ocr:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ocr
    command: ["./ocr"]
    env_file:
      - .env
    depends_on:
      paddleocr:
        condition: service_healthy
    restart: unless-stopped

  paddleocr:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    container_name: paddleocr
    environment:
      OCR_LANG: ${OCR_LANG:-fr+en}
      PADDLEOCR_VERSION: ${PADDLEOCR_VERSION:-PP-OCRv5}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: unless-stopped
