services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: api
    command: ["./api"]
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: worker
    command: ["./worker"]
    env_file:
      - .env
    restart: unless-stopped

  frame:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: frame
    command: ["./frame"]
    env_file:
      - .env
    restart: unless-stopped

  ocr:
    build:
      context: ./cmd/ocr
      dockerfile: Dockerfile
    shm_size: "1gb"
    environment:
      OCR_LANG: ${OCR_LANG:-fr+en}
      PADDLEOCR_VERSION: ${PADDLEOCR_VERSION:-PP-OCRv5}
      OCR_INFER_CONCURRENCY: ${OCR_INFER_CONCURRENCY:-2}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 240s
    restart: unless-stopped
